name: iOS

# iOS 移植的构建与交付链路（无 Mac 开发环境）：
#   1. macOS runner 跑 ComicReaderCore 单元测试（移植逻辑的完整验证）
#   2. XcodeGen 生成 Xcode 工程 → 未签名 archive → 组装 Payload IPA 上传
#      （用户用 Sideloadly / AltStore 以免费 Apple ID 重签安装）
#   3. 打 v*-ios 标签时把 IPA 附到 GitHub Release
# 桌面版的 ci.yml / release.yml 完全不受影响。

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
    # 标签推送（路径过滤对 tag 不生效）：与桌面版 release.yml 同一批 v* 标签
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  core-tests:
    name: ComicReaderCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run core package tests
        run: |
          set -o pipefail
          # -v：链接命令行进入日志，链接期问题可凭日志直接定位是哪些目标文件在链上
          swift test --package-path ios/ComicCore -v 2>&1 | tee core-test.log

      # 失败时把错误摘到注解里（无需 admin 权限也能在 API/网页上直接看到原因）。
      # 链接器错误的关键行（duplicate symbol / Undefined symbols / ld:）没有
      # "error:" 前缀，必须一并抓取，否则只能对着截断信息瞎猜。
      - name: Report core test failure
        if: failure()
        run: |
          SUMMARY=$(grep -nE 'error:|duplicate symbol|Undefined symbols|ld: |URKArchive\.mm\.o' core-test.log | head -30 | cut -c1-400 | tr '\n' '§')
          echo "::error title=Swift test failed::${SUMMARY:-unknown, see log}"
          # 未定义符号错误前后的原始窗口（决定性上下文）
          LINE=$(grep -n 'Undefined symbols' core-test.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            FROM=$((LINE > 3 ? LINE - 3 : 1))
            WINDOW=$(sed -n "${FROM},$((FROM + 40))p" core-test.log | cut -c1-300 | tr '\n' '§')
            echo "::error title=Undefined symbols context::${WINDOW}"
          fi

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/App/project.yml --project ios/App

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/ComicReader.xcodeproj \
            -scheme ComicReader \
            -destination 'generic/platform=iOS' \
            -archivePath build/ComicReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Report build failure
        if: failure()
        run: |
          SUMMARY=$(grep -E 'error:' xcodebuild.log | head -5 | tr '\n' '§')
          echo "::error title=xcodebuild failed::${SUMMARY:-unknown, see log}"

      - name: Assemble IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ComicReader.xcarchive/Products/Applications/ComicReader.app build/Payload/
          cd build && zip -qry ComicReader-unsigned.ipa Payload
          ls -la ComicReader-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicReader-unsigned-ipa
          path: build/ComicReader-unsigned.ipa

  release:
    name: Attach IPA to release
    runs-on: ubuntu-latest
    needs: build-ipa
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ComicReader-unsigned-ipa
          path: build

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 桌面版 release.yml（electron-builder --publish always）会先建「草稿」Release 再人工发布。
          # 这里优先复用已存在的 Release（草稿或已发布），不存在时才建草稿——不抢发布权。
          gh release upload "$TAG" build/ComicReader-unsigned.ipa --clobber 2>/dev/null \
            || gh release create "$TAG" build/ComicReader-unsigned.ipa \
                 --draft --title "$TAG" \
                 --notes "iOS 未签名 IPA：用 Sideloadly / AltStore 以免费 Apple ID 重签安装（7 天需重签）。"
